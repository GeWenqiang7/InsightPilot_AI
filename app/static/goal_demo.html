<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InsightPilot Goal Demo</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 24px; }
      .row { margin-bottom: 12px; }
      input, textarea { width: 100%; padding: 8px; }
      button { margin-right: 8px; padding: 8px 12px; }
      pre { background: #f5f5f5; padding: 12px; border-radius: 8px; overflow-x: auto; }
      .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    </style>
  </head>
  <body>
    <h2>InsightPilot - Goal 生成演示界面</h2>
    <p>说明：这是展示层，不改动你核心 pipeline 逻辑。</p>

    <div class="card">
      <div class="row">
        <label>CSV 路径</label>
        <input id="dataPath" placeholder="/absolute/path/to/your.csv" />
      </div>
      <div class="row">
        <label>初始需求</label>
        <textarea id="userQuery" rows="3" placeholder="例如：我想预测用户流失并制定干预策略"></textarea>
      </div>
      <button onclick="createSession()">创建会话</button>
      <span id="sessionInfo"></span>
    </div>

    <div class="card">
      <button onclick="generateGoals()">生成 Goal</button>
      <div class="row">
        <label>补充需求（用于重生成）</label>
        <input id="refineQuery" placeholder="new: 控制误报并提高召回" />
      </div>
      <button onclick="refineGoals()">重生成 Goal</button>
      <div class="row">
        <label>选择 Goal ID</label>
        <input id="goalId" placeholder="例如 1" />
      </div>
      <button onclick="selectGoal()">选择 Goal</button>
    </div>

    <div class="card">
      <h3>响应结果</h3>
      <pre id="output">{}</pre>
    </div>

    <script>
      let sessionId = null;

      function show(data) {
        document.getElementById("output").textContent = JSON.stringify(data, null, 2);
      }

      async function createSession() {
        const dataPath = document.getElementById("dataPath").value.trim();
        const userQuery = document.getElementById("userQuery").value.trim();
        const res = await fetch("/sessions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ data_path: dataPath, user_query: userQuery, use_real_llm: false })
        });
        const data = await res.json();
        if (!res.ok) return show(data);
        sessionId = data.session_id;
        document.getElementById("sessionInfo").textContent = `Session: ${sessionId}`;
        show(data);
      }

      async function generateGoals() {
        if (!sessionId) return alert("请先创建会话");
        const res = await fetch(`/sessions/${sessionId}/generate`, { method: "POST" });
        show(await res.json());
      }

      async function refineGoals() {
        if (!sessionId) return alert("请先创建会话");
        const newQuery = document.getElementById("refineQuery").value.trim();
        const res = await fetch(`/sessions/${sessionId}/refine`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ new_query: newQuery })
        });
        show(await res.json());
      }

      async function selectGoal() {
        if (!sessionId) return alert("请先创建会话");
        const goalId = Number(document.getElementById("goalId").value.trim());
        const res = await fetch(`/sessions/${sessionId}/select`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ goal_id: goalId })
        });
        show(await res.json());
      }
    </script>
  </body>
  </html>
