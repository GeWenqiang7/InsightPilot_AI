ke="#566074" stroke-width="2.5"/><polygon points="1898.5,738 1912.5,738 1905.5,748" fill="#566074"/><rect x="1671.0" y="730" rx="16" ry="16" width="469.0" height="166" fill="#1d2230" stroke="#3a3f4b" stroke-width="1.2"/><rect x="1683.0" y="742" rx="10" ry="10" width="445.0" height="32" fill="#232734" stroke="#fcd34d" stroke-width="1"/><text x="1695.0" y="764" class="layerTitle">Critic / Audit 层</text><text x="1697.0" y="796" class="item">• reviewer</text><text x="1697.0" y="818" class="item">• risk checks</text><text x="1697.0" y="840" class="item">• leakage checks</text><text x="1697.0" y="862" class="item">• fallback</text><line x1="1905.5" y1="904" x2="1905.5" y2="924" stroke="#566074" stroke-width="2.5"/><polygon points="1898.5,918 1912.5,918 1905.5,928" fill="#566074"/><rect x="1671.0" y="910" rx="16" ry="16" width="469.0" height="166" fill="#1d2230" stroke="#3a3f4b" stroke-width="1.2"/><rect x="1683.0" y="922" rx="10" ry="10" width="445.0" height="32" fill="#232734" stroke="#fcd34d" stroke-width="1"/><text x="1695.0" y="944" class="layerTitle">Shared Memory 与 Tools 层</text><text x="1697.0" y="976" class="item">• shared vector memory</text><text x="1697.0" y="998" class="item">• user prefs</text><text x="1697.0" y="1020" class="item">• tool registry</text><text x="1697.0" y="1042" class="item">• eval logs</text><rect x="1671.0" y="1315" rx="16" ry="16" width="469.0" height="64" fill="#232734" stroke="#fcd34d" stroke-width="1.2"/><text x="1687.0" y="1337" class="small">优势：复杂任务拆分清晰，适合 reviewer / specialist 分工</text><text x="1687.0" y="1361" class="tiny">适用：平台型 AI 分析系统 / 高复杂协作流</text><text x="40" y="1462" class="tiny">阅读方式：从上到下表示系统层次；越靠上的层越接近用户入口，越靠下越接近执行、知识与基础设施。</text></svg>