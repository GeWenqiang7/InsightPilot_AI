Ali Display Ad Click Dataset (Taobao Ad CTR Dataset)
===================================================

1. Introduction
---------------------------------------------------
Ali_Display_Ad_Click 是阿里巴巴提供的一个用于广告点击率（CTR, Click-Through Rate）预测的数据集。
该数据来源于淘宝网站的展示广告点击日志，主要用于研究广告推荐、用户行为分析以及CTR预测问题。 :contentReference[oaicite:0]{index=0}

该任务的核心目标是：
预测用户在看到广告后是否会点击该广告。

---------------------------------------------------

2. Dataset Overview
---------------------------------------------------
该数据集主要由以下四张表组成：

1. raw_sample
   - 原始训练样本（广告展示与点击日志）
   - 字段：
     user_id, ad_id, nonclk, clk, timestamp

2. ad_feature
   - 广告基础信息
   - 字段：
     ad_id, campaign_id, cate_id, brand, price

3. user_profile
   - 用户画像信息
   - 字段：
     user_id, age, gender, shopping_level 等

4. raw_behavior_log
   - 用户行为日志（历史行为）
   - 字段：
     user_id, btag, cate, brand, timestamp

---------------------------------------------------

3. raw_sample（核心训练数据）
---------------------------------------------------
数据来源：
从淘宝随机抽取约 114 万用户，在 8 天内的广告展示/点击日志（约 2600 万条记录）。

字段说明：
- user: 用户ID
- time_stamp: 时间戳（Bigint）
- adgroup_id: 广告ID
- pid: 场景ID
- nonclk: 未点击（1 表示未点击）
- clk: 点击（1 表示点击）

数据划分：
- 前7天：训练集（20170506 - 20170512）
- 第8天：测试集（20170513）

---------------------------------------------------

4. ad_feature（广告特征）
---------------------------------------------------
描述广告本身属性：

字段：
- adgroup_id: 广告ID
- cate_id: 类目ID
- campaign_id: 广告活动ID
- brand: 品牌ID
- customer_id: 广告主ID
- price: 商品价格

关系：
- 一个广告对应一个商品
- 商品属于某个类目和品牌

---------------------------------------------------

5. user_profile（用户画像）
---------------------------------------------------
包含用户基本属性信息（约106万用户）

字段：
- userid: 用户ID
- cms_segid: 微群ID
- cms_group_id: 用户群组ID
- final_gender_code: 性别（1男，2女）
- age_level: 年龄段
- pvalue_level: 消费水平（1低，2中，3高）
- shopping_level: 购物深度（1浅，2中，3深）
- occupation: 是否学生（1是，0否）
- new_user_class_level: 城市等级

---------------------------------------------------

6. raw_behavior_log（用户行为日志）
---------------------------------------------------
描述用户过去22天的行为数据（约7亿条记录）

字段：
- user: 用户ID
- time_stamp: 时间戳
- btag: 行为类型
- cate: 类目ID
- brand: 品牌ID

行为类型（btag）：
- pv: 浏览（page view）
- cart: 加入购物车
- fav: 收藏
- buy: 购买

注意：
由于数据来自不同系统，user_id + timestamp 可能存在重复记录。

---------------------------------------------------

7. Typical Research Task
---------------------------------------------------
基于用户历史行为与特征：

👉 预测用户是否会点击某个广告（CTR预测）

---------------------------------------------------

8. Baseline
---------------------------------------------------
参考模型AUC约为：
AUC = 0.622

---------------------------------------------------

9. Application Scenarios
---------------------------------------------------
该数据集广泛应用于：

- 广告推荐系统
- CTR预测模型（Logistic Regression, XGBoost, Deep Learning）
- 用户行为分析
- 推荐系统（RecSys）
- 深度学习模型（如DIN, Wide&Deep）

